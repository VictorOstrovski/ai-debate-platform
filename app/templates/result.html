<!DOCTYPE html>
<html>
<head>
    <title>Debate Result</title>
</head>
<body>

    <h1>Debate Result</h1>

    <h2>Statement</h2>
    <p>{{ question }}</p>

    <hr>

    <h2>PRO</h2>
    <p>{{ pro }}</p>

    <h2>CON</h2>
    <p>{{ con }}</p>

    <hr>

    <h2>Result</h2>

    <p>
        <strong>Winner:</strong> {{ winner }}
    </p>

    <p>
        <strong>PRO Score:</strong> {{ pro_score }}
    </p>

    <p>
        <strong>CON Score:</strong> {{ con_score }}
    </p>

    <hr>

    <h2>ARBITER ANALYSIS</h2>
    <p>{{ arbiter }}</p>

    <br>

    <a href="/">New Debate</a>

</body>
</html>
